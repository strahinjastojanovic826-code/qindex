[package]
name = "qindex"
version = "0.6.1"
edition = "2024"
authors = ["Strale <strahinjastojanovic826@gmail.com>"]
description = "A 2-bit quaternary indexing library optimized for RAM compression and GPU DMA transfers."
readme = "README.md"
repository = "https://github.com/strahinjastojanovic826-code/qindex" 
license = "AGPL-3.0-only"
keywords = ["quaternary", "bit-packing", "gpu", "dma", "no-deps"]
categories = ["data-structures", "encoding", "hardware-support"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
